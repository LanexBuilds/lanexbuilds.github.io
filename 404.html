<script>
(function(){
  var d = document.documentElement;
  d.classList.add("js");
  try {
    var t = localStorage.getItem("lm-theme");
    if (t === "dark" || t === "light") d.setAttribute("data-theme", t);
  } catch (e) {}
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) d.classList.add("nm");
})();
</script>
<style>
:root{
  color-scheme:light;
  --paper:#F2F5F8;--paper-2:#FBFCFE;--panel:#FFFFFF;
  --ink:#0A1F33;--ink-2:#3D5166;--ink-3:#6B7C8F;
  --line:#CFDAE5;--line-soft:#E4EBF2;
  --warm:#C9480D;--warm-bright:#E85D1F;
  --cool:#0E7A8A;--cool-bright:#17A0B4;
  --warm-soft:#FFF1E8;--cool-soft:#E5F4F7;
  --sans:"Archivo","Helvetica Neue",Arial,sans-serif;
  --serif:"Source Serif 4",Georgia,serif;
  --wrap:1180px;--gutter:28px;--radius:10px;--radius-lg:16px;
  --ease:cubic-bezier(.2,.8,.2,1);
  --ease-out:cubic-bezier(.16,1,.3,1);
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0B1626;--paper-2:#0F1D30;--panel:#152540;
  --ink:#EAF0F7;--ink-2:#B4C1D1;--ink-3:#7E8FA3;
  --line:#253A56;--line-soft:#1C2E46;
  --warm:#FF8A57;--warm-bright:#FFA37A;
  --cool:#4CC2D4;--cool-bright:#6FD8E8;
  --warm-soft:#2A1810;--cool-soft:#0D2530;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#0B1626;--paper-2:#0F1D30;--panel:#152540;
    --ink:#EAF0F7;--ink-2:#B4C1D1;--ink-3:#7E8FA3;
    --line:#253A56;--line-soft:#1C2E46;
    --warm:#FF8A57;--warm-bright:#FFA37A;
    --cool:#4CC2D4;--cool-bright:#6FD8E8;
    --warm-soft:#2A1810;--cool-soft:#0D2530;
  }
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scrollbar-gutter:stable}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--sans);font-size:17px;line-height:1.55;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  min-height:100vh;display:flex;flex-direction:column;
}
img,svg{display:block;max-width:100%}
a{color:inherit}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--warm);outline-offset:3px;border-radius:2px}
h1,h2,h3,h4{
  font-family:var(--sans);font-stretch:112%;font-weight:750;
  line-height:1.08;letter-spacing:-.015em;margin:0;text-wrap:balance;
}
p{margin:0}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 var(--gutter)}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.pillb,.ib,.fab,.totop,.hdr-btn{
  transition:background-color .18s,color .18s,border-color .18s,transform .12s var(--ease),opacity .25s;
}
.pillb:not(:disabled):active,.fab:active,.totop:active,.hdr-btn:active{transform:scale(.96)}

html.theme-anim *,html.theme-anim *::before,html.theme-anim *::after{
  transition:background-color .4s ease,color .4s ease,border-color .4s ease,fill .4s ease,stroke .4s ease!important;
}

/* Logo */
.logo{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.logo-mark{width:28px;height:28px;flex:none;color:currentColor;transition:transform .4s var(--ease)}
.logo:hover .logo-mark{transform:rotate(-6deg) scale(1.05)}
.logo-word{font-weight:700;font-stretch:114%;font-size:17px;letter-spacing:-.01em}

/* Header */
header.top{
  color:var(--ink);background:var(--paper);border-bottom:1px solid var(--line);
  animation:introFade .5s ease backwards;
}
@supports (background:color-mix(in srgb,red,blue)){
  header.top{
    background:color-mix(in srgb,var(--paper) 88%,transparent);
    -webkit-backdrop-filter:blur(14px) saturate(140%);
    backdrop-filter:blur(14px) saturate(140%);
  }
}
header.top .bar{
  display:flex;justify-content:space-between;align-items:center;gap:12px 32px;
  padding:16px var(--gutter);
}
nav ul{display:flex;gap:26px;list-style:none;margin:0;padding:0;flex-wrap:wrap}
nav a{
  text-decoration:none;font-size:15px;font-weight:500;color:var(--ink-2);
  padding:4px 0;position:relative;transition:color .2s;
}
nav a::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:2px;
  background:var(--warm);transform:scaleX(0);transform-origin:left;
  transition:transform .35s var(--ease);
}
nav a:hover{color:var(--ink)}
nav a:hover::after{transform:scaleX(1)}

.hdr-tools{display:flex;align-items:center;gap:8px}
.hdr-btn{
  display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;
  color:var(--ink);background:transparent;border:1.5px solid var(--line);border-radius:999px;
  padding:6px 12px;cursor:pointer;
}
.hdr-btn:hover{border-color:var(--ink)}
.hdr-btn.sq{padding:6px;width:36px;height:36px;justify-content:center;position:relative}
.hdr-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ico-sun,.ico-moon{position:absolute;transition:transform .5s var(--ease),opacity .3s}
#btn-theme .ico-sun{opacity:0;transform:rotate(-90deg) scale(.5)}
#btn-theme .ico-moon{opacity:1;transform:none}
#btn-theme[data-theme="dark"] .ico-sun{opacity:1;transform:none}
#btn-theme[data-theme="dark"] .ico-moon{opacity:0;transform:rotate(90deg) scale(.5)}

@media (max-width:860px){
  header.top .bar{flex-wrap:wrap;padding:12px var(--gutter)}
  .hdr-tools{order:2}
  header.top nav{order:3;width:100%;overflow-x:auto;scrollbar-width:none;margin:0 -2px}
  header.top nav::-webkit-scrollbar{display:none}
  nav ul{flex-wrap:nowrap;white-space:nowrap;gap:22px}
  .hdr-btn{padding:6px;width:36px;height:36px;justify-content:center}
}

/* Main 404 area */
main{
  flex:1;display:flex;align-items:center;justify-content:center;
  padding:80px var(--gutter) 64px;
}
.notfound{
  max-width:640px;width:100%;text-align:center;
  animation:introUp .7s var(--ease-out) .1s backwards;
}
.notfound .code{
  font-family:var(--sans);font-stretch:135%;font-weight:800;
  font-size:clamp(96px,20vw,180px);line-height:.85;
  letter-spacing:-.05em;
  color:var(--ink);
  position:relative;display:inline-block;
  margin-bottom:24px;
}
.notfound .code::after{
  content:"";position:absolute;left:50%;bottom:8%;
  width:70%;height:14%;
  transform:translateX(-50%);
  background:
    repeating-linear-gradient(90deg,
      var(--warm) 0 12px,
      transparent 12px 24px);
  opacity:.35;border-radius:4px;
  z-index:-1;
}
.notfound h1{
  font-size:clamp(26px,4vw,40px);letter-spacing:-.025em;
  font-stretch:112%;font-weight:750;
  color:var(--ink);margin-bottom:16px;
}
.notfound .lede{
  font-family:var(--serif);font-size:clamp(17px,1.9vw,19px);
  line-height:1.6;color:var(--ink-2);max-width:46ch;
  margin:0 auto 36px;
}
.notfound .actions{
  display:flex;gap:12px;flex-wrap:wrap;justify-content:center;
}
.notfound .path{
  display:inline-block;margin-top:32px;
  font-family:var(--serif);font-size:13.5px;color:var(--ink-3);
  padding:6px 14px;border-radius:999px;
  background:var(--paper-2);border:1px solid var(--line);
  max-width:100%;overflow-wrap:anywhere;
  font-variant-numeric:tabular-nums;
}
.notfound .path strong{color:var(--ink-2);font-weight:600}

@media (max-width:560px){
  main{padding:64px var(--gutter) 48px}
  .notfound .code{margin-bottom:16px}
}

/* Buttons */
.pillb{
  font-size:14px;font-weight:600;border:1.5px solid var(--ink);background:transparent;
  color:var(--ink);border-radius:999px;padding:9px 18px;cursor:pointer;
  display:inline-flex;align-items:center;gap:8px;text-decoration:none;
}
.pillb:hover{background:var(--ink);color:var(--panel)}
a.pillb{text-decoration:none}
.pillb.solid{background:var(--ink);color:var(--panel)}
.pillb.solid:hover{background:transparent;color:var(--ink)}
.pillb svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* Footer */
footer{
  padding:32px 0;
  border-top:1px solid var(--line);
}
.foot-bar{
  display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;
  color:var(--ink-3);font-size:13.5px;
  max-width:var(--wrap);margin:0 auto;
  padding-left:var(--gutter);padding-right:var(--gutter);
}
.foot-bar .killsw{
  display:inline-flex;align-items:center;gap:8px;
  font-size:12.5px;font-weight:600;color:var(--ink-3);background:transparent;
  border:1.5px dashed var(--line);border-radius:999px;padding:4px 12px;cursor:pointer;
  transition:color .2s,border-color .2s,transform .12s;margin-left:auto;
}
.foot-bar .killsw:hover{color:var(--ink);border-color:var(--warm)}
.foot-bar .killsw:active{transform:scale(.96)}
.foot-bar .killsw .dot{
  width:8px;height:8px;border-radius:50%;background:#d93a2b;
  box-shadow:0 0 0 3px color-mix(in srgb,#d93a2b 22%,transparent);
}

/* Dialog */
dialog{
  border:1px solid var(--line);background:var(--panel);color:var(--ink);
  border-radius:var(--radius-lg);padding:0;
  width:min(580px,calc(100% - 24px));max-height:calc(100dvh - 32px);
  overflow:auto;overscroll-behavior:contain;
}
dialog::backdrop{background:rgba(8,16,28,.62);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
dialog[open]{animation:dlgIn .32s var(--ease-out)}
dialog.closing{animation:dlgOut .2s ease forwards}
.mini-in{padding:28px clamp(20px,4vw,36px) 24px}
.mini-in h2{font-size:clamp(22px,3.4vw,30px);margin:4px 0 14px;letter-spacing:-.02em}
.mini-kicker{margin:0;font-size:13.5px;color:var(--ink-3)}
.mini-nav{
  display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;
  padding:16px clamp(20px,4vw,36px);border-top:1px solid var(--line);
  background:var(--paper);
}
.crow{
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;
  align-items:center;padding:14px 0;border-top:1px solid var(--line);
}
.crow .label{
  display:block;font-size:12px;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3);margin-bottom:2px;
}
.crow .val{font-weight:600;overflow-wrap:anywhere;font-size:16px}
.crow .acts{display:flex;gap:8px}
.compose{
  margin-top:8px;padding-top:20px;border-top:2px solid var(--ink);
  display:grid;gap:12px;
}
.compose label{font-size:13px;font-weight:600;display:grid;gap:5px;color:var(--ink)}
.compose input,.compose textarea{
  font:inherit;font-size:16px;color:var(--ink);background:var(--paper);
  border:1.5px solid var(--line);border-radius:8px;padding:10px 14px;width:100%;
  resize:vertical;transition:border-color .2s;
}
.compose input:focus,.compose textarea:focus{border-color:var(--ink);outline:none}
.compose textarea{min-height:110px;font-family:var(--serif)}

/* Toast */
.toast{
  position:fixed;left:50%;bottom:max(28px,env(safe-area-inset-bottom));
  transform:translate(-50%,20px);z-index:70;margin:0;
  background:var(--ink);color:var(--paper);font-size:14.5px;font-weight:600;
  padding:11px 20px;border-radius:999px;border:0;
  opacity:0;pointer-events:none;
  transition:opacity .3s,transform .35s var(--ease-out),overlay .3s allow-discrete,display .3s allow-discrete;
  max-width:calc(100% - 32px);text-align:center;
  box-shadow:0 12px 32px -12px rgba(10,31,51,.5);
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@keyframes introFade{from{opacity:0}}
@keyframes introUp{from{opacity:0;transform:translateY(18px)}}
@keyframes dlgIn{from{opacity:0;transform:translateY(18px) scale(.97)}}
@keyframes dlgOut{to{opacity:0;transform:translateY(10px) scale(.98)}}

html.nm *,html.nm *::before,html.nm *::after{
  animation:none!important;transition:none!important;
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

@media print{
  header.top,footer,.notfound .actions,.toast,dialog{display:none!important}
  body{background:#fff;color:#000}
  main{padding:40px 24px}
  .notfound .code{color:#000}
  .notfound .path{border-color:#999}
}
</style>

<script>
const CONTACT = {
  email: "exlanmislang@gmail.com",
  discord: "",
  whatsapp: "",
  telegram: ""
};

(function () {
"use strict";

const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const root = document.documentElement;
const reduceMQ = matchMedia("(prefers-reduced-motion: reduce)");
let killed = false;
const motionOK = () => !(reduceMQ.matches || killed);
function applyMotion() { root.classList.toggle("nm", !motionOK()); }
function node(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
const SVG = {
  copy: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>'
};

/* ---------- Toast ---------- */
const toastEl = $("#toast"); let toastT;
function toast(msg) {
  toastEl.textContent = msg;
  if (!toastEl.matches(":popover-open")) { try { toastEl.showPopover(); } catch (e) {} }
  toastEl.classList.add("show");
  clearTimeout(toastT);
  toastT = setTimeout(() => {
    toastEl.classList.remove("show");
    setTimeout(() => { try { if (toastEl.matches(":popover-open")) toastEl.hidePopover(); } catch (e) {} }, 350);
  }, 2400);
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; } catch (e) {}
  try {
    const ta = document.createElement("textarea"); ta.value = t; ta.setAttribute("readonly", "");
    ta.style.cssText = "position:fixed;opacity:0;top:0;left:0";
    document.body.append(ta); ta.select();
    const ok = document.execCommand("copy"); ta.remove(); return ok;
  } catch (e) { return false; }
}

/* ---------- Dialog ---------- */
function openDlg(d) { d.classList.remove("closing"); if (!d.open) d.showModal(); }
function closeDlg(d) {
  if (!d.open || d.classList.contains("closing")) return;
  if (!motionOK()) { d.close(); return; }
  d.classList.add("closing");
  let done = false;
  const end = () => { if (done) return; done = true; d.classList.remove("closing"); if (d.open) d.close(); };
  d.addEventListener("animationend", function onEnd(e) { if (e.target !== d) return; d.removeEventListener("animationend", onEnd); end(); });
  setTimeout(end, 280);
}
function wireDlg(d) {
  d.addEventListener("cancel", e => { e.preventDefault(); closeDlg(d); });
  d.addEventListener("click", e => { if (e.target === d) closeDlg(d); });
}
$$("dialog").forEach(wireDlg);

/* ---------- Theme ---------- */
const metaTheme = $('meta[name="theme-color"]');
const darkMQ = matchMedia("(prefers-color-scheme: dark)");
function effectiveTheme() { const t = root.getAttribute("data-theme"); return t || (darkMQ.matches ? "dark" : "light"); }
function syncTheme() {
  const t = effectiveTheme(); const b = $("#btn-theme");
  metaTheme.setAttribute("content", t === "dark" ? "#0B1626" : "#F2F5F8");
  b.dataset.theme = t;
  b.setAttribute("aria-label", t === "dark" ? "Switch to light theme" : "Switch to dark theme");
}
function toggleTheme() {
  const next = effectiveTheme() === "dark" ? "light" : "dark";
  if (motionOK()) { root.classList.add("theme-anim"); setTimeout(() => root.classList.remove("theme-anim"), 600); }
  root.setAttribute("data-theme", next);
  try { localStorage.setItem("lm-theme", next); } catch (e) {}
  syncTheme();
}
$("#btn-theme").addEventListener("click", toggleTheme);
if (darkMQ.addEventListener) darkMQ.addEventListener("change", syncTheme);
syncTheme();

/* ---------- Show what path they tried ---------- */
(function () {
  const path = location.pathname + location.hash;
  if (path && path !== "/" && path.length > 1) {
    $("#path-display").hidden = false;
    $("#path-value").textContent = path.length > 80 ? path.slice(0, 80) + "…" : path;
  }
})();

/* ---------- Contact ---------- */
const cd = $("#contactdlg"), cdBody = $("#cd-body");
function contactRows() {
  const rows = [];
  if (CONTACT.email) rows.push({ label: "Email", text: CONTACT.email, href: "mailto:" + CONTACT.email, copy: CONTACT.email, copyMsg: "Email copied" });
  if (CONTACT.discord) rows.push({ label: "Discord", text: CONTACT.discord, copy: CONTACT.discord, copyMsg: "Discord username copied" });
  if (CONTACT.whatsapp) rows.push({ label: "WhatsApp", text: "+" + CONTACT.whatsapp, href: "https://wa.me/" + CONTACT.whatsapp, ext: true });
  if (CONTACT.telegram) rows.push({ label: "Telegram", text: "@" + CONTACT.telegram, href: "https://t.me/" + CONTACT.telegram, ext: true });
  return rows;
}
function copyBtn(row, cls) {
  const b = node("button", "pillb " + (cls || ""), "");
  b.type = "button";
  b.innerHTML = SVG.copy + '<span class="t">Copy</span>';
  b.setAttribute("aria-label", "Copy " + row.label);
  b.addEventListener("click", async () => {
    toast(await copyText(row.copy) ? row.copyMsg : "Could not copy");
  });
  return b;
}
(function () {
  cdBody.append(node("p", "mini-kicker", "Open to automation projects, collaborations and internships."));
  const h = node("h2", "", "Let's talk"); h.id = "cd-title"; cdBody.append(h);
  contactRows().forEach(row => {
    const r = node("div", "crow"), left = node("div");
    left.append(node("span", "label", row.label), node("span", "val", row.text));
    const acts = node("div", "acts");
    if (row.copy) acts.append(copyBtn(row));
    if (row.href) {
      const a = node("a", "pillb", row.ext ? "Open" : "Write"); a.href = row.href;
      if (row.ext) { a.rel = "noopener"; a.target = "_blank"; }
      acts.append(a);
    }
    r.append(left, acts); cdBody.append(r);
  });
  if (CONTACT.email) {
    const c = node("div", "compose");
    const l1 = node("label", "", "Your name"); const n = node("input");
    n.type = "text"; n.autocomplete = "name"; l1.append(n);
    const l2 = node("label", "", "Message"); const m = node("textarea");
    m.placeholder = "What are you building?"; l2.append(m);
    const go = node("button", "pillb solid", "Open in your email app"); go.type = "button";
    go.addEventListener("click", () => {
      if (!m.value.trim()) { m.focus(); toast("Write a short message first."); return; }
      const body = m.value.trim() + (n.value.trim() ? "\n\n" + n.value.trim() : "");
      location.href = "mailto:" + CONTACT.email +
        "?subject=" + encodeURIComponent("Hello from your portfolio") +
        "&body=" + encodeURIComponent(body);
    });
    c.append(l1, l2, go); cdBody.append(c);
  }
})();
$("#talk-btn").addEventListener("click", () => openDlg(cd));
$("#cd-close").addEventListener("click", () => closeDlg(cd));

/* ---------- Kill switch ---------- */
function setKilled(v) {
  killed = v; applyMotion();
  $("#kill-txt").textContent = v ? "Restart animation" : "Stop all animation";
  toast(v ? "Kill switch pulled." : "Back online.");
}
$("#kill").addEventListener("click", () => setKilled(!killed));

/* ---------- Start ---------- */
$("#year").textContent = new Date().getFullYear();
applyMotion();

})();
</script>
